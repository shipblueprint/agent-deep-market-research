[project]
name = "deep-market-research-agent"
version = "0.1.0"
description = "Token-efficient single-agent market research system built with CrewAI"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11.5"
dependencies = [
    "crewai[tools]>=1.15.1",
    "exa-py>=2.16.0",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.34.2",
    "tiktoken>=0.12.0",
]

[project.urls]
Repository = "https://github.com/shipschematic/agent-deep-market-research"

[tool.uv]
# soupsieve <4.0 has open advisories; all supported Python versions must use a fixed release.
constraint-dependencies = ["soupsieve>=4.0.0"]
